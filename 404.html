<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0F3057">
<title>Page not found | Project Persist</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;700&family=Space+Mono:wght@700&display=swap">
<style>
  :root{
    --navy:#0F3057; --navy-deep:#081B30; --on-navy:#FFFFFF; --on-navy-soft:#E4EBF2;
    --brass:#C79A46; --flare:#E4562E; --flare-strong:#B23A1A;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    padding:40px 20px; text-align:center;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--on-navy);
    font-family:'Karla', -apple-system, 'Segoe UI', Roboto, sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  img{ display:block; margin:0 auto 26px; width:64px; height:64px; border-radius:50%; background:#fff; }
  .kicker{
    font-family:'Space Mono', monospace; font-size:.72rem; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; color:var(--brass);
  }
  h1{
    font-family:'Fraunces', Georgia, serif; font-weight:600; line-height:1.1;
    font-size:clamp(1.9rem,3vw + 1rem,2.8rem); margin:10px 0 0; color:#fff;
  }
  p{ margin:16px auto 0; max-width:46ch; color:var(--on-navy-soft); }
  .btn-row{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:30px; }
  a.btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:13px 24px; border-radius:999px; font-weight:700; font-size:.95rem;
    text-decoration:none; border:1.5px solid transparent;
  }
  .btn--primary{ background:var(--flare-strong); color:#fff; }
  .btn--primary:hover{ background:var(--flare); }
  .btn--outline{ border-color:currentColor; color:var(--on-navy); }
  .btn--outline:hover{ background:rgba(255,255,255,.08); }
  :focus-visible{ outline:2px solid var(--flare); outline-offset:3px; border-radius:2px; }
</style>
</head>
<body>
  <main>
    <img src="/images/logo-persistence.png" alt="" width="260" height="260">
    <span class="kicker">Error 404</span>
    <h1>This one's drifted off course.</h1>
    <p>We can't find the page you're after &mdash; but the crossing is still very much on. Head back and follow along.</p>
    <div class="btn-row">
      <a class="btn btn--primary" href="/">Back to Project Persist</a>
      <a class="btn btn--outline" href="/#contact">Get in touch</a>
    </div>
  </main>
</body>
</html>
